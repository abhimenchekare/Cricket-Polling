<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03060f" />
<title>Big Screen · Cricket Auction Live Polls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
<link rel="stylesheet" href="/css/theme.css?v=2.2.1" />
<link rel="stylesheet" href="/css/display.css?v=2.2.1" />
</head>
<body class="display-body">
<div class="dp-controls">
  <button class="icon-btn" id="fs-btn" title="Full screen (F)" aria-label="Toggle full screen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
  <a class="icon-btn" href="/admin" title="Admin dashboard" aria-label="Admin dashboard">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></svg>
  </a>
</div>

<div class="display">
  <header class="dp-head">
    <div class="dp-brand">
      <div class="dp-logo">🏏</div>
      <div class="dp-event">
        <div class="dp-event-name" data-event-name>Cricket Auction Live Polls</div>
        <div class="dp-event-sub" data-event-tagline>Office Cricket Auction</div>
      </div>
    </div>
    <div class="dp-head-right">
      <div class="dp-stat">
        <div class="dp-stat-value" id="dp-participants">0</div>
        <div class="dp-stat-label">Participants</div>
      </div>
      <div class="dp-stat">
        <div class="dp-stat-value" id="dp-votes">0</div>
        <div class="dp-stat-label">Votes</div>
      </div>
      <div class="dp-clock" id="dp-clock">--:--</div>
    </div>
  </header>

  <main class="dp-main" id="dp-main">
    <div class="dp-idle">
      <h1>Connecting to the poll room…</h1>
    </div>
  </main>

  <footer class="dp-foot">
    <div class="dp-qr">
      <div style="font-size:clamp(20px,2vw,34px)">📱</div>
      <div>
        <div class="dp-qr-text">Open this link on your phone to vote</div>
        <div class="dp-qr-url" id="dp-url">—</div>
      </div>
    </div>
    <div class="dp-hint" id="dp-hint">Waiting for the host</div>
  </footer>
</div>

<script src="/js/app.js?v=2.2.1"></script>
<script src="/js/display.js?v=2.2.1"></script>
</body>
</html>
