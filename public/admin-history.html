<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b1c" />
<meta name="robots" content="noindex" />
<title>History &amp; Reports · Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
<link rel="stylesheet" href="/css/theme.css?v=3.9.2" />
<link rel="stylesheet" href="/css/admin.css?v=3.9.2" />
</head>
<body class="admin-body">
<div class="admin">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🏏</div>
      <div class="brand-text">
        <div class="brand-title" data-event-name>Cricket Auction</div>
        <div class="brand-sub">Poll control</div>
      </div>
    </div>
    <a class="side-link" data-nav href="/admin">Dashboard</a>
    <a class="side-link" data-nav href="/admin-polls">Polls</a>
    <a class="side-link" data-nav href="/admin-participants">Participants</a>
    <a class="side-link" data-nav href="/admin-history">History &amp; reports</a>
    <a class="side-link" data-nav href="/admin-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a5 5 0 1 0 0 10A5 5 0 1 0 12 2z"/><path d="M4 22a8 8 0 0 1 16 0"/></svg>Auction list</a>
    <a class="side-link" data-nav href="/admin-results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>Results ledger</a>
    <div class="side-sep"></div>
    <a class="side-link" href="/display" target="_blank" rel="noopener">🖥 Big screen</a>
    <button class="side-link" data-logout style="background:none;border:0;cursor:pointer;width:100%;text-align:left;font:inherit">Sign out</button>
    <div class="grow"></div>
    <div class="mute-sm" style="padding:10px 12px">Signed in as<br /><strong data-admin-name style="color:var(--text)">admin</strong></div>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <a class="icon-btn" href="/admin" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div>
        <h1>History &amp; Reports</h1>
        <div class="admin-top-sub">Every poll · exports</div>
      </div>
      <div class="grow"></div>
      <span id="admin-conn"></span>
      <button class="btn btn-ghost btn-sm" id="export-all">⬇ All polls CSV</button>
    </header>

    <main class="admin-content">
      <section class="kpis" id="h-kpis"></section>

      <div class="toolbar section">
        <div class="filter-chips" id="h-filters">
          <button class="chip active" data-f="all">All polls</button>
          <button class="chip" data-f="closed">Closed</button>
          <button class="chip" data-f="active">Live</button>
          <button class="chip" data-f="draft">Drafts</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="export-people">⬇ Participants CSV</button>
      </div>

      <section id="h-list"></section>

      <section class="card section">
        <div class="card-head">
          <div>
            <div class="eyebrow">Audit trail</div>
            <div class="card-title" style="margin-top:4px">Full activity log</div>
          </div>
        </div>
        <div class="activity" id="h-activity" style="max-height:420px"></div>
      </section>
    </main>

    <nav class="tabbar">
      <a class="tab" href="/admin">Home</a>
      <a class="tab" href="/admin-polls">Polls</a>
      <a class="tab" href="/admin-participants">People</a>
      <a class="tab active" href="/admin-history">Reports</a>
    </nav>
  </div>
</div>

<script src="/js/app.js?v=3.9.2"></script>
<script src="/js/guess-sheet.js?v=3.9.2"></script>
<script src="/js/admin-shell.js?v=3.9.2"></script>
<script src="/js/admin-poll-ui.js?v=3.9.2"></script>
<script src="/js/admin-history.js?v=3.9.2"></script>
</body>
</html>
