<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b1c" />
<title>Live Poll · Cricket Auction</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
<link rel="stylesheet" href="/css/theme.css?v=3.0.0" />
<link rel="stylesheet" href="/css/participant.css?v=3.0.0" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🏏</div>
      <div class="brand-text">
        <div class="brand-title" data-event-name>Cricket Auction Live Polls</div>
        <div class="brand-sub" data-event-tagline>Office Cricket Auction</div>
      </div>
    </div>
    <div class="grow"></div>
    <span id="conn"></span>
    <button class="icon-btn" id="logout-btn" title="Leave polls" aria-label="Leave polls">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <main class="wrap">
    <section class="card greet fade-up" style="margin-top:16px">
      <div class="avatar" id="avatar">?</div>
      <div class="grow">
        <div class="greet-name" id="greet-name">Hi there</div>
        <div class="greet-sub" id="greet-sub">—</div>
      </div>
      <a class="btn btn-ghost btn-sm" href="/results">Results</a>
    </section>

    <div class="row" id="stats-bar" style="margin-top:12px;flex-wrap:wrap;gap:8px"></div>

    <section id="poll-area" class="section"></section>
    <section id="results-area" class="section"></section>
    <section id="history-area" class="section"></section>

    <p class="mute-sm center" style="margin-top:24px">Stay on this page · it updates live</p>
  </main>
</div>

<script src="/js/app.js?v=3.0.0"></script>
<script src="/js/poll.js?v=3.0.0"></script>
</body>
</html>
