<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b1c" />
<title>Poll Results · Cricket Auction</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
<link rel="stylesheet" href="/css/theme.css?v=4.1.0" />
<link rel="stylesheet" href="/css/participant.css?v=4.1.0" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="icon-btn" href="/poll" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">
      <div class="brand-text">
        <div class="brand-title">Poll Results</div>
        <div class="brand-sub" data-event-tagline>Live audience results</div>
      </div>
    </div>
    <div class="grow"></div>
    <span id="conn"></span>
  </header>

  <main class="wrap">
    <section id="standings" class="section"></section>
    <section id="current" class="section"></section>
    <section id="archive" class="section"></section>
    <p class="mute-sm center" style="margin-top:24px">Results refresh automatically</p>
  </main>
</div>

<script src="/js/app.js?v=4.1.0"></script>
<script src="/js/results.js?v=4.1.0"></script>

</html>
